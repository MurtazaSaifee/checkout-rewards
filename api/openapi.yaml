openapi: 3.0.3
info:
  title: Checkout and Rewards API
  version: 0.1.0
  description: |
    Every response carries an `X-Request-Id` header. An error response is an
    RFC 9457 Problem Details document (`application/problem+json`) with a
    stable machine-readable `code` and the same `requestId`.

    Money is always an integer number of cents.

    Status rule: 400 malformed request or missing header, 401 missing or wrong
    admin key, 402 payment declined, 404 resource missing or not visible to the
    caller, 409 conflicts with current state that may succeed later, 422 well
    formed but violates a business rule.

    Unknown paths and methods answer 404 `ROUTE_NOT_FOUND` as a Problem
    Details document; that answer is not repeated per operation below.
servers:
  - url: /api
    description: API base path. Paths below are relative to it.
tags:
  - name: products
    description: Catalogue browsing. Needs no customer identifier.
  - name: carts
    description: >-
      A cart belongs to the customer who created it. Every operation with this
      tag needs the customer identifier header, and another customer's cart is
      answered as not found.
  - name: checkout
    description: >-
      Turns the calling customer's cart into an order at current prices. The
      whole checkout either places the order in full or changes nothing.
  - name: orders
    description: >-
      A customer sees only their own orders. Another customer's order is
      answered as not found.
  - name: coupons
    description: >-
      A customer sees only their own coupons. Each coupon belongs to the
      customer who placed the milestone order it rewards.
  - name: admin
    description: >-
      Store administration. Operations with this tag are restricted to the
      store administrator and require the admin key header.
paths:
  /products:
    get:
      tags:
        - products
      operationId: listProducts
      summary: List products with current unit price and stock.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Every product, ordered by id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts:
    post:
      tags:
        - carts
      operationId: createCart
      summary: Create an empty cart owned by the calling customer.
      description: >-
        Not idempotent. A retried request creates another empty cart, which
        does no harm.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
      responses:
        '201':
          description: The new empty cart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}:
    get:
      tags:
        - carts
      operationId: getCart
      summary: View a cart with current prices, line amounts, subtotal and line count.
      description: >-
        Prices are read from the products when the cart is viewed. A cart
        stores no prices.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: The cart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}/lines/{productId}:
    put:
      tags:
        - carts
      operationId: setCartLineQuantity
      summary: Set the quantity of a product in the cart, creating the line if needed.
      description: >-
        Idempotent. The quantity is replaced, not added to, so repeating the
        request leaves the cart unchanged. Stock is checked here as a courtesy
        only: it is taken at checkout, not when a line is set.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLineQuantity'
      responses:
        '200':
          description: The cart after the change.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - carts
      operationId: removeCartLine
      summary: Remove a product's line from the cart.
      description: >-
        Removing a line that is already gone succeeds and returns the cart
        unchanged.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The cart after the change.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}/checkout:
    post:
      tags:
        - checkout
      operationId: checkOutCart
      summary: Check out the cart, placing an order at current prices.
      description: >-
        Places the order in full or changes nothing. The cart is locked, its
        lines are priced at current prices, stock is taken for every line, and
        the next order number is assigned. A cart yields at most one order, and
        a checked-out cart can no longer be changed.


        A checkout may name one coupon by its code. The coupon must be one the
        calling customer holds and has not redeemed. Its percentage comes off
        the subtotal, rounded down to a whole cent and taken once, and the
        order records the coupon, the percentage and the discount. Placing the
        order redeems the coupon. A checkout that fails for any reason leaves
        the coupon unredeemed.


        Every checkout needs an `Idempotency-Key` header. Keys are scoped to the
        customer. A retry with the same key and the same request returns the
        original status and body, even when the first attempt is still running:
        the retry waits for it. The same key with a different request is
        answered 422 IDEMPOTENCY_KEY_REUSED. A checkout that fails stores nothing
        under its key, so a retry with that key is evaluated again.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: The placed order. A replay returns the original status and body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentDeclined'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    get:
      tags:
        - orders
      operationId: listMyOrders
      summary: List the calling customer's orders, in order-number order.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
      responses:
        '200':
          description: The customer's orders, oldest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      tags:
        - orders
      operationId: getOrder
      summary: View one of the calling customer's orders.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order, with its lines as they were at checkout.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /coupons:
    get:
      tags:
        - coupons
      operationId: listMyCoupons
      summary: List the calling customer's coupons, in milestone order.
      description: >-
        Each coupon shows whether an order has redeemed it. Coupons never expire.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
      responses:
        '200':
          description: The customer's coupons, oldest milestone first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/coupons:
    get:
      tags:
        - admin
      operationId: listAllCoupons
      summary: List every coupon with the customer it was issued to.
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Every coupon, oldest milestone first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCouponList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - admin
      operationId: generateCoupon
      summary: Issue a coupon for the oldest unrewarded milestone.
      description: >-
        Issues at most one coupon per call, for the oldest reached milestone
        that has no coupon yet, to the customer who placed that milestone's
        order. The response says how many reached milestones still have no
        coupon. Concurrent calls never issue two coupons for one milestone.
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: The coupon issued, its customer and the unrewarded milestones remaining.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedCoupon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/orders:
    get:
      tags:
        - admin
      operationId: listAllOrders
      summary: List every placed order with its customer, lines and totals.
      description: >-
        Every customer's orders, in order-number order, so the report can be
        checked against them. Each order carries the customer it belongs to.
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Every order, oldest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/report:
    get:
      tags:
        - admin
      operationId: getReport
      summary: Report sales and coupons, calculated from the orders and coupons on every request.
      description: >-
        Read-only. Every figure is computed from the placed orders, their lines
        and the coupons when the request arrives, so nothing is stored and
        reading the report changes nothing. All money is in integer cents.
        Net revenue is the sum of the order totals, which equals gross revenue
        less discounts because each order's total is its subtotal less its
        discount. Unrewarded milestones are the milestones reached by the
        order count, less the coupons generated.
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The report, as of the moment the request was read.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Shared key for the store administrator. Required by every admin operation.
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional identifier echoed back in the response and in error bodies.
        Identifiers that are not 1 to 128 characters of letters, digits, dot,
        underscore, colon or hyphen are replaced with a generated one.
      schema:
        type: string
    CustomerIdHeader:
      name: X-Customer-Id
      in: header
      required: true
      description: >-
        Identifies the calling customer. Every cart operation requires it; a
        request without it is answered 400 CUSTOMER_ID_REQUIRED. The identifier
        is claimed, not verified, so it is a business rule and not a security
        control.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Identifies one checkout attempt. Send the same key to retry the same
        checkout. A missing or blank key is answered 400
        IDEMPOTENCY_KEY_REQUIRED.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    CartId:
      name: cartId
      in: path
      required: true
      description: Identifier of the cart, as returned when it was created.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: Stable product identifier, as listed by GET /products.
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identifier of the order, as returned when it was placed.
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: The request identifier for this exchange.
      schema:
        type: string
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - unitPriceCents
        - stock
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable product identifier, used in cart paths.
          example: ceramic-mug
        name:
          type: string
          example: Ceramic Mug
        unitPriceCents:
          type: integer
          minimum: 0
          description: Current unit price in cents.
          example: 1200
        stock:
          type: integer
          minimum: 0
          description: Units currently available to sell.
          example: 60
    ProductList:
      type: object
      required:
        - products
      additionalProperties: false
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CartLine:
      type: object
      required:
        - productId
        - name
        - unitPriceCents
        - quantity
        - lineAmountCents
      additionalProperties: false
      properties:
        productId:
          type: string
          example: ceramic-mug
        name:
          type: string
          example: Ceramic Mug
        unitPriceCents:
          type: integer
          minimum: 0
          description: Current unit price of the product in cents, not the price when the line was set.
          example: 1200
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        lineAmountCents:
          type: integer
          minimum: 0
          description: Unit price in cents multiplied by quantity.
          example: 2400
    Cart:
      type: object
      required:
        - id
        - status
        - lines
        - lineCount
        - subtotalCents
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - open
            - checked_out
          description: A checked-out cart can no longer be changed.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        lineCount:
          type: integer
          minimum: 0
          description: Number of lines in the cart.
          example: 2
        subtotalCents:
          type: integer
          minimum: 0
          description: Sum of the line amounts in cents.
          example: 3600
    SetLineQuantity:
      type: object
      required:
        - quantity
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Whole number of units from 1 to 99. Replaces any quantity already in the cart.
          example: 2
    OrderLine:
      type: object
      required:
        - productId
        - name
        - unitPriceCents
        - quantity
        - lineAmountCents
      additionalProperties: false
      properties:
        productId:
          type: string
          example: ceramic-mug
        name:
          type: string
          description: Product name as it was at checkout, not as it is now.
          example: Ceramic Mug
        unitPriceCents:
          type: integer
          minimum: 0
          description: Unit price in cents as it was at checkout.
          example: 1200
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        lineAmountCents:
          type: integer
          minimum: 0
          description: Unit price in cents multiplied by quantity.
          example: 2400
    Order:
      type: object
      required:
        - id
        - orderNumber
        - placedAt
        - lines
        - subtotalCents
        - couponCode
        - couponPercentOff
        - discountCents
        - totalCents
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: integer
          minimum: 1
          description: Position in the sequence of all orders placed, starting at 1 with no gaps.
          example: 1
        placedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        subtotalCents:
          type: integer
          minimum: 0
          description: Sum of the line amounts in cents.
          example: 3350
        couponCode:
          type: string
          nullable: true
          description: The coupon the order redeemed, or null when it redeemed none.
          example: K7HQ2XM9PA
        couponPercentOff:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: The percentage the coupon took off the subtotal, or null when no coupon was redeemed.
          example: 10
        discountCents:
          type: integer
          minimum: 0
          description: The coupon's percentage of the subtotal, rounded down to a whole cent. Zero when no coupon was redeemed.
          example: 0
        totalCents:
          type: integer
          minimum: 0
          description: The amount charged, in cents. The subtotal less the discount.
          example: 3350
    CheckoutRequest:
      type: object
      description: >-
        Options for a checkout. The body is optional, and an empty object
        means the defaults.
      additionalProperties: false
      properties:
        expectedTotalCents:
          type: integer
          minimum: 0
          description: >-
            The total the customer saw, in cents. Optional. When it is sent and
            differs from the total at current prices, the checkout is refused
            with 409 PRICE_CHANGED, which carries the current total in
            currentTotalCents. Nothing is placed, so the same cart can be
            checked out again at that total.
          example: 3600
        paymentToken:
          type: string
          enum:
            - tok_ok
            - tok_decline
          default: tok_ok
          description: >-
            The payment gateway's answer for this checkout. tok_ok approves the
            charge; tok_decline declines it, and the checkout is answered 402
            PAYMENT_DECLINED.
          example: tok_ok
        couponCode:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The code of the one coupon this checkout redeems. An unknown code is
            answered 422 COUPON_NOT_FOUND, a coupon issued to another customer
            422 COUPON_NOT_OWNED, and a coupon already redeemed 422
            COUPON_ALREADY_REDEEMED. Omit it for a checkout without a coupon.
          example: K7HQ2XM9PA
    OrderList:
      type: object
      required:
        - orders
      additionalProperties: false
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    Coupon:
      type: object
      required:
        - code
        - percentOff
        - milestone
        - redeemed
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            Ten characters from letters and digits, without 0, O, 1, I or L, so
            a code is easy to type. The customer gives it at checkout to redeem.
          pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{10}$'
          example: K7HQ2XM9PA
        percentOff:
          type: integer
          minimum: 1
          maximum: 100
          description: The percentage the coupon takes off. Fixed when the coupon was issued.
          example: 10
        milestone:
          type: integer
          minimum: 1
          description: The milestone the coupon rewards, counting from 1. Milestone k is reached by order number k times n.
          example: 1
        redeemed:
          type: boolean
          description: Whether an order has redeemed the coupon.
          example: false
    CouponList:
      type: object
      required:
        - coupons
      additionalProperties: false
      properties:
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/Coupon'
    GeneratedCoupon:
      type: object
      required:
        - coupon
        - customerId
        - unrewardedMilestonesRemaining
      additionalProperties: false
      properties:
        coupon:
          $ref: '#/components/schemas/Coupon'
        customerId:
          type: string
          description: The customer the coupon was issued to, who placed order number milestone times n.
          example: alice
        unrewardedMilestonesRemaining:
          type: integer
          minimum: 0
          description: Reached milestones that still have no coupon after this one.
          example: 0
    AdminCoupon:
      type: object
      required:
        - code
        - percentOff
        - milestone
        - customerId
        - issuedAt
        - redeemedByOrderId
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{10}$'
          example: K7HQ2XM9PA
        percentOff:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        milestone:
          type: integer
          minimum: 1
          example: 1
        customerId:
          type: string
          description: The customer the coupon was issued to.
          example: alice
        issuedAt:
          type: string
          format: date-time
        redeemedByOrderId:
          type: string
          format: uuid
          nullable: true
          description: The order that redeemed the coupon, or null while it is unredeemed.
    AdminCouponList:
      type: object
      required:
        - coupons
      additionalProperties: false
      properties:
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/AdminCoupon'
    AdminOrder:
      type: object
      description: A placed order as the administrator sees it, with the customer it belongs to.
      required:
        - id
        - orderNumber
        - customerId
        - placedAt
        - lines
        - subtotalCents
        - couponCode
        - couponPercentOff
        - discountCents
        - totalCents
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: integer
          minimum: 1
          description: Position in the sequence of all orders placed, starting at 1 with no gaps.
          example: 1
        customerId:
          type: string
          description: The customer who placed the order.
          example: alice
        placedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        subtotalCents:
          type: integer
          minimum: 0
          description: Sum of the line amounts in cents.
          example: 3350
        couponCode:
          type: string
          nullable: true
          description: The coupon the order redeemed, or null when it redeemed none.
          example: K7HQ2XM9PA
        couponPercentOff:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: The percentage the coupon took off the subtotal, or null when no coupon was redeemed.
          example: 10
        discountCents:
          type: integer
          minimum: 0
          description: The coupon's percentage of the subtotal, rounded down to a whole cent. Zero when no coupon was redeemed.
          example: 0
        totalCents:
          type: integer
          minimum: 0
          description: The amount charged, in cents. The subtotal less the discount.
          example: 3350
    AdminOrderList:
      type: object
      required:
        - orders
      additionalProperties: false
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrder'
    UnitsSold:
      type: object
      required:
        - productId
        - name
        - quantity
      additionalProperties: false
      properties:
        productId:
          type: string
          example: ceramic-mug
        name:
          type: string
          description: The product's current name.
          example: Ceramic Mug
        quantity:
          type: integer
          minimum: 1
          description: Units of the product on placed orders.
          example: 3
    Report:
      type: object
      description: >-
        Sales and reward figures for the store, calculated on each request.
        Net revenue equals gross revenue less discounts.
      required:
        - orderCount
        - unitsSold
        - grossRevenueCents
        - discountCents
        - netRevenueCents
        - couponsGenerated
        - couponsRedeemed
        - couponsAvailable
        - unrewardedMilestones
      additionalProperties: false
      properties:
        orderCount:
          type: integer
          minimum: 0
          description: Number of placed orders.
          example: 3
        unitsSold:
          type: array
          description: Products with at least one unit on a placed order, in product identifier order.
          items:
            $ref: '#/components/schemas/UnitsSold'
        grossRevenueCents:
          type: integer
          minimum: 0
          description: Sum of the order subtotals, before discounts.
          example: 7750
        discountCents:
          type: integer
          minimum: 0
          description: Sum of the order discounts.
          example: 95
        netRevenueCents:
          type: integer
          minimum: 0
          description: Sum of the order totals, which is gross revenue less discounts.
          example: 7655
        couponsGenerated:
          type: integer
          minimum: 0
          description: Coupons issued so far.
          example: 1
        couponsRedeemed:
          type: integer
          minimum: 0
          description: Coupons redeemed by an order.
          example: 1
        couponsAvailable:
          type: integer
          minimum: 0
          description: Coupons issued and not yet redeemed.
          example: 0
        unrewardedMilestones:
          type: integer
          minimum: 0
          description: Milestones reached by the order count that have no coupon yet.
          example: 0
    ErrorCode:
      type: string
      description: Stable machine-readable error identifier.
      enum:
        - VALIDATION_FAILED
        - MALFORMED_JSON
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - CUSTOMER_ID_REQUIRED
        - CART_NOT_FOUND
        - CART_ALREADY_CHECKED_OUT
        - PRODUCT_NOT_FOUND
        - INSUFFICIENT_STOCK
        - CART_EMPTY
        - ORDER_NOT_FOUND
        - ADMIN_KEY_INVALID
        - NO_ELIGIBLE_MILESTONE
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - PAYMENT_DECLINED
        - COUPON_NOT_FOUND
        - COUPON_NOT_OWNED
        - COUPON_ALREADY_REDEEMED
        - PRICE_CHANGED
    Problem:
      type: object
      description: RFC 9457 Problem Details, extended with `code` and `requestId`.
      required:
        - type
        - title
        - status
        - detail
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          example: https://checkout-rewards.example/problems/VALIDATION_FAILED
        title:
          type: string
          example: Request validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          example: Query parameter "color" is not allowed.
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
          example: 6f1c2a0e-0b8e-4c53-9a4e-2a8f1d7c9e10
      additionalProperties: true
  responses:
    BadRequest:
      description: 'Malformed request: bad JSON, unknown or invalid parameters, or a missing required header.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        A resource is missing or not visible to the caller. CART_NOT_FOUND
        covers a cart that does not exist and a cart that belongs to another
        customer alike. PRODUCT_NOT_FOUND names an unknown product.
        ORDER_NOT_FOUND covers an order that does not exist and an order that
        belongs to another customer alike.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request conflicts with the current state and may succeed later
        after the client re-reads the resource. CART_ALREADY_CHECKED_OUT means
        the cart was checked out. INSUFFICIENT_STOCK lists each short line in
        shortLines, with the requested and available quantities.
        PRICE_CHANGED means the total at current prices differs from the
        expectedTotalCents the checkout sent; currentTotalCents holds that
        current total, and nothing was placed. NO_ELIGIBLE_MILESTONE means no
        reached milestone is waiting for a coupon.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The admin key header is missing, or it does not match the configured admin key. ADMIN_KEY_INVALID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: >-
        The request is well formed but violates a business rule. CART_EMPTY
        means the cart has no lines, so there is nothing to order.
        IDEMPOTENCY_KEY_REUSED means the key was already used for a different
        request. COUPON_NOT_FOUND, COUPON_NOT_OWNED and COUPON_ALREADY_REDEEMED
        mean the named coupon cannot be redeemed by this checkout.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaymentDeclined:
      description: >-
        The payment gateway declined the charge. PAYMENT_DECLINED means nothing
        was placed: stock, the cart and the order numbering are unchanged, the
        cart is still open, and the same cart can be checked out again with
        another payment token.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected failure. The request identifier appears in the server log.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
