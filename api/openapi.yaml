openapi: 3.0.3
info:
  title: Checkout and Rewards API
  version: 0.1.0
  description: |
    Every response carries an `X-Request-Id` header. An error response is an
    RFC 9457 Problem Details document (`application/problem+json`) with a
    stable machine-readable `code` and the same `requestId`.

    Money is always an integer number of cents.

    Status rule: 400 malformed request or missing header, 401 missing or wrong
    admin key, 402 payment declined, 404 resource missing or not visible to the
    caller, 409 conflicts with current state that may succeed later, 422 well
    formed but violates a business rule.

    Unknown paths and methods answer 404 `ROUTE_NOT_FOUND` as a Problem
    Details document; that answer is not repeated per operation below.
servers:
  - url: /api
    description: API base path. Paths below are relative to it.
tags:
  - name: products
    description: Catalogue browsing. Needs no customer identifier.
  - name: carts
    description: >-
      A cart belongs to the customer who created it. Every operation with this
      tag needs the customer identifier header, and another customer's cart is
      answered as not found.
  - name: checkout
    description: >-
      Turns the calling customer's cart into an order at current prices. The
      whole checkout either places the order in full or changes nothing.
  - name: orders
    description: >-
      A customer sees only their own orders. Another customer's order is
      answered as not found.
  - name: admin
    description: >-
      Store administration. Operations with this tag are restricted to the
      store administrator and require the admin key header.
paths:
  /products:
    get:
      tags:
        - products
      operationId: listProducts
      summary: List products with current unit price and stock.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Every product, ordered by id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts:
    post:
      tags:
        - carts
      operationId: createCart
      summary: Create an empty cart owned by the calling customer.
      description: >-
        Not idempotent. A retried request creates another empty cart, which
        does no harm.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
      responses:
        '201':
          description: The new empty cart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}:
    get:
      tags:
        - carts
      operationId: getCart
      summary: View a cart with current prices, line amounts, subtotal and line count.
      description: >-
        Prices are read from the products when the cart is viewed. A cart
        stores no prices.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: The cart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}/lines/{productId}:
    put:
      tags:
        - carts
      operationId: setCartLineQuantity
      summary: Set the quantity of a product in the cart, creating the line if needed.
      description: >-
        Idempotent. The quantity is replaced, not added to, so repeating the
        request leaves the cart unchanged. Stock is checked here as a courtesy
        only: it is taken at checkout, not when a line is set.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLineQuantity'
      responses:
        '200':
          description: The cart after the change.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - carts
      operationId: removeCartLine
      summary: Remove a product's line from the cart.
      description: >-
        Removing a line that is already gone succeeds and returns the cart
        unchanged.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The cart after the change.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}/checkout:
    post:
      tags:
        - checkout
      operationId: checkOutCart
      summary: Check out the cart, placing an order at current prices.
      description: >-
        Places the order in full or changes nothing. The cart is locked, its
        lines are priced at current prices, stock is taken for every line, and
        the next order number is assigned. A cart yields at most one order, and
        a checked-out cart can no longer be changed.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/CartId'
      responses:
        '201':
          description: The placed order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    get:
      tags:
        - orders
      operationId: listMyOrders
      summary: List the calling customer's orders, in order-number order.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
      responses:
        '200':
          description: The customer's orders, oldest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      tags:
        - orders
      operationId: getOrder
      summary: View one of the calling customer's orders.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CustomerIdHeader'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order, with its lines as they were at checkout.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Shared key for the store administrator. Required by every admin operation.
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional identifier echoed back in the response and in error bodies.
        Identifiers that are not 1 to 128 characters of letters, digits, dot,
        underscore, colon or hyphen are replaced with a generated one.
      schema:
        type: string
    CustomerIdHeader:
      name: X-Customer-Id
      in: header
      required: true
      description: >-
        Identifies the calling customer. Every cart operation requires it; a
        request without it is answered 400 CUSTOMER_ID_REQUIRED. The identifier
        is claimed, not verified, so it is a business rule and not a security
        control.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    CartId:
      name: cartId
      in: path
      required: true
      description: Identifier of the cart, as returned when it was created.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: Stable product identifier, as listed by GET /products.
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identifier of the order, as returned when it was placed.
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: The request identifier for this exchange.
      schema:
        type: string
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - unitPriceCents
        - stock
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable product identifier, used in cart paths.
          example: ceramic-mug
        name:
          type: string
          example: Ceramic Mug
        unitPriceCents:
          type: integer
          minimum: 0
          description: Current unit price in cents.
          example: 1200
        stock:
          type: integer
          minimum: 0
          description: Units currently available to sell.
          example: 60
    ProductList:
      type: object
      required:
        - products
      additionalProperties: false
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CartLine:
      type: object
      required:
        - productId
        - name
        - unitPriceCents
        - quantity
        - lineAmountCents
      additionalProperties: false
      properties:
        productId:
          type: string
          example: ceramic-mug
        name:
          type: string
          example: Ceramic Mug
        unitPriceCents:
          type: integer
          minimum: 0
          description: Current unit price of the product in cents, not the price when the line was set.
          example: 1200
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        lineAmountCents:
          type: integer
          minimum: 0
          description: Unit price in cents multiplied by quantity.
          example: 2400
    Cart:
      type: object
      required:
        - id
        - status
        - lines
        - lineCount
        - subtotalCents
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - open
            - checked_out
          description: A checked-out cart can no longer be changed.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        lineCount:
          type: integer
          minimum: 0
          description: Number of lines in the cart.
          example: 2
        subtotalCents:
          type: integer
          minimum: 0
          description: Sum of the line amounts in cents.
          example: 3600
    SetLineQuantity:
      type: object
      required:
        - quantity
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Whole number of units from 1 to 99. Replaces any quantity already in the cart.
          example: 2
    OrderLine:
      type: object
      required:
        - productId
        - name
        - unitPriceCents
        - quantity
        - lineAmountCents
      additionalProperties: false
      properties:
        productId:
          type: string
          example: ceramic-mug
        name:
          type: string
          description: Product name as it was at checkout, not as it is now.
          example: Ceramic Mug
        unitPriceCents:
          type: integer
          minimum: 0
          description: Unit price in cents as it was at checkout.
          example: 1200
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        lineAmountCents:
          type: integer
          minimum: 0
          description: Unit price in cents multiplied by quantity.
          example: 2400
    Order:
      type: object
      required:
        - id
        - orderNumber
        - placedAt
        - lines
        - subtotalCents
        - totalCents
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: integer
          minimum: 1
          description: Position in the sequence of all orders placed, starting at 1 with no gaps.
          example: 1
        placedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        subtotalCents:
          type: integer
          minimum: 0
          description: Sum of the line amounts in cents.
          example: 3350
        totalCents:
          type: integer
          minimum: 0
          description: The amount charged, in cents.
          example: 3350
    OrderList:
      type: object
      required:
        - orders
      additionalProperties: false
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    ErrorCode:
      type: string
      description: Stable machine-readable error identifier.
      enum:
        - VALIDATION_FAILED
        - MALFORMED_JSON
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - CUSTOMER_ID_REQUIRED
        - CART_NOT_FOUND
        - CART_ALREADY_CHECKED_OUT
        - PRODUCT_NOT_FOUND
        - INSUFFICIENT_STOCK
        - CART_EMPTY
        - ORDER_NOT_FOUND
    Problem:
      type: object
      description: RFC 9457 Problem Details, extended with `code` and `requestId`.
      required:
        - type
        - title
        - status
        - detail
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          example: https://checkout-rewards.example/problems/VALIDATION_FAILED
        title:
          type: string
          example: Request validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          example: Query parameter "color" is not allowed.
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
          example: 6f1c2a0e-0b8e-4c53-9a4e-2a8f1d7c9e10
      additionalProperties: true
  responses:
    BadRequest:
      description: 'Malformed request: bad JSON, unknown or invalid parameters, or a missing required header.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        A resource is missing or not visible to the caller. CART_NOT_FOUND
        covers a cart that does not exist and a cart that belongs to another
        customer alike. PRODUCT_NOT_FOUND names an unknown product.
        ORDER_NOT_FOUND covers an order that does not exist and an order that
        belongs to another customer alike.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request conflicts with the current state and may succeed later
        after the client re-reads the resource. CART_ALREADY_CHECKED_OUT means
        the cart was checked out. INSUFFICIENT_STOCK lists each short line in
        shortLines, with the requested and available quantities.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: >-
        The request is well formed but violates a business rule. CART_EMPTY
        means the cart has no lines, so there is nothing to order.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected failure. The request identifier appears in the server log.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
